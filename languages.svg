<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210">
<style>
  :root { --card: #f6f8fa; --border: #d0d7de; --title: #8250df; --body: #24292f; --muted: #656d76; }
  @media (prefers-color-scheme: dark) { :root { --card: #21262d; --border: #30363d; --title: #f778ba; --body: #e6edf3; --muted: #b1bac4; } }
</style>
<rect x="10" y="10" width="620" height="190" rx="12" fill="var(--card)" stroke="var(--border)"/>
<text x="34" y="48" fill="var(--title)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">Most Used Languages</text>
<clipPath id="bar"><rect x="34" y="70" width="572" height="10" rx="5"/></clipPath><g clip-path="url(#bar)"><rect x="34.0" y="70" width="170.3" height="10" fill="#f1e05a"/><rect x="204.3" y="70" width="148.8" height="10" fill="#3572A5"/><rect x="353.1" y="70" width="127.8" height="10" fill="#3178c6"/><rect x="480.9" y="70" width="68.3" height="10" fill="#663399"/><rect x="549.2" y="70" width="36.6" height="10" fill="#e34c26"/><rect x="585.7" y="70" width="9.8" height="10" fill="#00ADD8"/></g>
<circle cx="40" cy="110" r="5" fill="#f1e05a"/><text x="52" y="114" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Python <tspan fill="var(--muted)">29.77%</tspan></text><circle cx="325" cy="110" r="5" fill="#3572A5"/><text x="337" y="114" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">JavaScript <tspan fill="var(--muted)">26.02%</tspan></text><circle cx="40" cy="139" r="5" fill="#3178c6"/><text x="52" y="143" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">TypeScript <tspan fill="var(--muted)">22.34%</tspan></text><circle cx="325" cy="139" r="5" fill="#663399"/><text x="337" y="143" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">CSS <tspan fill="var(--muted)">11.93%</tspan></text><circle cx="40" cy="168" r="5" fill="#e34c26"/><text x="52" y="172" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">HTML <tspan fill="var(--muted)">6.39%</tspan></text><circle cx="325" cy="168" r="5" fill="#00ADD8"/><text x="337" y="172" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Go <tspan fill="var(--muted)">1.71%</tspan></text>
