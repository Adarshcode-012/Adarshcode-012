<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210">
<style>
  :root { --card: #f6f8fa; --border: #d0d7de; --title: #8250df; --body: #24292f; --muted: #656d76; }
  @media (prefers-color-scheme: dark) { :root { --card: #21262d; --border: #30363d; --title: #f778ba; --body: #e6edf3; --muted: #b1bac4; } }
</style>
<rect x="10" y="10" width="620" height="190" rx="12" fill="var(--card)" stroke="var(--border)"/>
<text x="34" y="48" fill="var(--title)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">Most Used Languages</text>
<clipPath id="bar"><rect x="34" y="70" width="572" height="10" rx="5"/></clipPath><g clip-path="url(#bar)"><rect x="34" y="70" width="169.9" height="10" fill="#f1e05a"/><rect x="203.9" y="70" width="152.2" height="10" fill="#3572A5"/><rect x="356.1" y="70" width="120.3" height="10" fill="#3178c6"/><rect x="476.4" y="70" width="76.9" height="10" fill="#663399"/><rect x="553.3" y="70" width="41.3" height="10" fill="#e34c26"/><rect x="594.6" y="70" width="11.2" height="10" fill="#00ADD8"/></g>
<circle cx="40" cy="110" r="5" fill="#f1e05a"/><text x="52" y="114" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">JavaScript <tspan fill="var(--muted)">29.70%</tspan></text><circle cx="325" cy="110" r="5" fill="#663399"/><text x="337" y="114" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">CSS <tspan fill="var(--muted)">13.46%</tspan></text>
<circle cx="40" cy="139" r="5" fill="#3572A5"/><text x="52" y="143" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Python <tspan fill="var(--muted)">26.60%</tspan></text><circle cx="325" cy="139" r="5" fill="#e34c26"/><text x="337" y="143" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">HTML <tspan fill="var(--muted)">7.25%</tspan></text>
<circle cx="40" cy="168" r="5" fill="#3178c6"/><text x="52" y="172" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">TypeScript <tspan fill="var(--muted)">21.03%</tspan></text><circle cx="325" cy="168" r="5" fill="#00ADD8"/><text x="337" y="172" fill="var(--body)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">Go <tspan fill="var(--muted)">1.96%</tspan></text>
</svg>
