name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  leetcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch LeetCode calendar
        run: python scripts/fetch_leetcode.py

      - name: Render heatmap
        run: python scripts/render_leetcode_heatmap.py

      - name: Commit refreshed profile art
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: refresh LeetCode activity"
          file_pattern: "data/leetcode.json leetcode-heatmap.svg"
